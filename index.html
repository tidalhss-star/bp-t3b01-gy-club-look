    <style>
        /* CSS Reset & Base */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Impact', system-ui, sans-serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.3;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            /* raw texture: noise-like gradient overlay */
            background-image: 
                repeating-linear-gradient(45deg, rgba(255,59,0,0.02) 0px, rgba(255,59,0,0.02) 2px, transparent 2px, transparent 6px),
                repeating-linear-gradient(-45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 4px);
            background-size: 8px 8px, 5px 5px;
        }

        /* Typography */
        h1, h2, h3, h4 {
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }
        h1 {
            font-size: clamp(4rem, 12vw, 8rem);
            line-height: 0.9;
        }
        h2 {
            font-size: clamp(3rem, 8vw, 5rem);
            line-height: 1;
        }
        h3 {
            font-size: 2rem;
        }
        p, li, blockquote {
            font-family: 'system-ui', sans-serif;
            font-weight: 300;
            font-size: 1.125rem;
            line-height: 1.6;
        }

        /* Layout & Spacing */
        header, main, footer {
            width: 100%;
            max-width: none;
            padding: 72px 72px 48px;
        }
        section {
            padding: 72px 0;
            margin-bottom: 120px;
        }
        .container {
            width: 100%;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            gap: 48px;
        }
        .flex {
            display: flex;
            gap: 48px;
            flex-wrap: wrap;
        }

        /* Borders – raw 3px solid */
        .border-accent {
            border: 3px solid #ff3b00;
        }
        .border-white {
            border: 3px solid #ffffff;
        }
        .border-black {
            border: 3px solid #000000;
        }
        .border-both {
            border: 3px solid #ffffff;
            outline: 3px solid #ff3b00;
            outline-offset: -6px;
        }

        /* Buttons & Links */
        .btn {
            display: inline-block;
            padding: 18px 48px;
            font-family: 'Impact', system-ui, sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            text-decoration: none;
            background-color: #ff3b00;
            color: #000000;
            border: 3px solid #ff3b00;
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #000000;
            color: #ff3b00;
            transform: scale(1.02) rotate(-1deg);
        }
        a {
            color: #ff3b00;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        a:hover {
            color: #ffffff;
        }

        /* Header & Navigation */
        header {
            padding-top: 36px;
            padding-bottom: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ffffff;
            background-color: rgba(0,0,0,0.95);
            position: relative;
            z-index: 100;
        }
        .logo {
            font-size: 2.2rem;
            letter-spacing: -0.03em;
            color: #ff3b00;
            text-decoration: none;
            border: 3px solid #ff3b00;
            padding: 8px 16px;
            transform: rotate(-1deg);
        }
        .logo:hover {
            background: #ff3b00;
            color: #000;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 48px;
            font-family: 'Impact', system-ui, sans-serif;
            font-size: 1.4rem;
            text-transform: uppercase;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 3px solid transparent;
            padding-bottom: 4px;
        }
        nav a:hover {
            border-bottom-color: #ff3b00;
            color: #ff3b00;
        }

        /* Hamburger (mobile) */
        #menu-toggle {
            display: none;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            padding: 10px;
            border: 2px solid #ffffff;
            background: transparent;
        }
        .hamburger span {
            display: block;
            width: 32px;
            height: 3px;
            background: #ffffff;
            transition: all 0.3s;
        }
        @media (max-width: 768px) {
            header {
                padding: 36px 24px;
            }
            .hamburger {
                display: flex;
            }
            nav {
                position: fixed;
                top: 0;
                right: -120%;
                width: 75%;
                height: 100vh;
                background: #000000;
                border-left: 3px solid #ff3b00;
                padding: 80px 48px;
                transition: right 0.35s ease;
                z-index: 200;
            }
            nav ul {
                flex-direction: column;
                gap: 32px;
                font-size: 2rem;
            }
            #menu-toggle:checked ~ nav {
                right: 0;
            }
            #menu-toggle:checked + .hamburger span:nth-child(1) {
                transform: rotate(45deg) translate(7px, 7px);
            }
            #menu-toggle:checked + .hamburger span:nth-child(2) {
                opacity: 0;
            }
            #menu-toggle:checked + .hamburger span:nth-child(3) {
                transform: rotate(-45deg) translate(6px, -6px);
            }
            /* overlay */
            #menu-toggle:checked::after {
                content: '';
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.6);
                z-index: 99;
            }
            /* adjust sections */
            section {
                padding: 48px 24px;
                margin-bottom: 80px;
            }
            .hero-grid {
                grid-template-columns: 1fr !important;
            }
        }

        /* Hero Section */
        .hero {
            padding-top: 24px;
            margin-bottom: 120px;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 48px;
            align-items: start;
        }
        .hero-title {
            transform: rotate(-0.5deg);
            margin-left: -8px;
        }
        .hero-title h1 {
            border-bottom: 4px solid #ff3b00;
            display: inline-block;
            padding-bottom: 8px;
        }
        .hero-sub {
            font-size: 1.8rem;
            font-family: 'Impact', system-ui, sans-serif;
            text-transform: uppercase;
            margin-top: 24px;
            display: inline-block;
            border: 3px solid #ffffff;
            padding: 12px 24px;
            transform: rotate(1deg);
        }
        .hero-visual {
            background: repeating-linear-gradient(45deg, #ff3b00 0px, #ff3b00 8px, #000000 8px, #000000 16px);
            border: 4px solid #ffffff;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            transform: rotate(1deg);
            position: relative;
        }
        .hero-visual::after {
            content: '☢︎';
            font-size: 8rem;
            opacity: 0.9;
            color: #000;
            text-shadow: 0 0 20px #ff3b00;
        }
        .hero-cta {
            margin-top: 48px;
        }

        /* Section titles */
        .section-title {
            border-bottom: 4px solid #ff3b00;
            padding-bottom: 8px;
            margin-bottom: 48px;
            display: inline-block;
            transform: rotate(-0.5deg);
        }

        /* Lookbook grid */
        .look-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 48px;
        }
        .look-card {
            border: 4px solid #ffffff;
            padding: 32px;
            background: rgba(255,59,0,0.05);
            transform: rotate(var(--rot, 0deg));
            position: relative;
        }
        .look-card:nth-child(odd) {
            --rot: -0.8deg;
        }
        .look-card:nth-child(even) {
            --rot: 0.8deg;
        }
        .look-card .emoji-badge {
            font-size: 4rem;
            display: block;
            margin-bottom: 16px;
        }
        .look-card h3 {
            font-size: 2rem;
            border-bottom: 2px solid #ff3b00;
            display: inline-block;
        }
        .look-card .data {
            font-family: 'system-ui', sans-serif;
            font-size: 0.9rem;
            color: #ccc;
            margin-top: 16px;
            border-top: 1px solid #333;
            padding-top: 12px;
        }

        /* UGC Reviews */
        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 48px;
        }
        .review-card {
            border: 4px solid #ffffff;
            padding: 32px;
            background: #0a0a0a;
            transform: rotate(var(--rot, 0deg));
        }
        .review-card:nth-child(odd) {
            --rot: -1deg;
        }
        .review-card:nth-child(even) {
            --rot: 1.2deg;
        }
        .review-card .stars {
            color: #ff3b00;
            font-size: 1.8rem;
            letter-spacing: 4px;
        }
        .review-card .meta {
            font-family: 'system-ui', sans-serif;
            font-size: 0.85rem;
            color: #888;
            margin: 8px 0 16px;
            border-left: 3px solid #ff3b00;
            padding-left: 12px;
        }
        .review-card blockquote {
            font-style: normal;
            font-weight: 300;
            border-top: 1px solid #333;
            padding-top: 16px;
        }

        /* Footer */
        footer {
            border-top: 4px solid #ffffff;
            padding-top: 48px;
            padding-bottom: 72px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            background: rgba(0,0,0,0.9);
        }
        footer .footer-inner {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 32px;
        }
        footer .contact {
            font-family: 'system-ui', sans-serif;
        }
        footer .contact a {
            font-size: 1.8rem;
            font-family: 'Impact', system-ui, sans-serif;
            color: #ff3b00;
            text-decoration: none;
            border: 2px solid #ff3b00;
            padding: 8px 24px;
            display: inline-block;
            margin-top: 8px;
        }
        footer .contact a:hover {
            background: #ff3b00;
            color: #000;
        }
        .copyright {
            font-size: 0.85rem;
            opacity: 0.6;
            border-top: 1px solid #333;
            padding-top: 24px;
            width: 100%;
            text-align: center;
        }

        /* Asymmetric overlapping extras */
        .skew-badge {
            display: inline-block;
            background: #ff3b00;
            color: #000;
            padding: 8px 32px;
            font-size: 1.4rem;
            border: 3px solid #fff;
            transform: rotate(-2deg);
            margin-top: 16px;
        }
        .negative-margin {
            margin-left: -24px;
            margin-right: -24px;
        }
        .full-bleed {
            width: 100vw;
            margin-left: calc(-50vw + 50%);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            header, main, footer {
                padding: 36px 24px;
            }
            .hero-grid {
                grid-template-columns: 1fr;
            }
            .hero-title h1 {
                font-size: 3.5rem;
            }
            .hero-visual {
                min-height: 200px;
            }
            .hero-visual::after {
                font-size: 5rem;
            }
            .look-grid, .reviews-grid {
                grid-template-columns: 1fr;
            }
            .btn {
                padding: 14px 32px;
                font-size: 1.2rem;
            }
        }

        /* Utility */
        .text-accent { color: #ff3b00; }
        .bg-accent { background-color: #ff3b00; color: #000; }
        .mt-48 { margin-top: 48px; }
        .mb-48 { margin-bottom: 48px; }
    </style>
